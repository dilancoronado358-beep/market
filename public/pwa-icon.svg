<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo redondeado estilo App Icon iOS/Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Borde sutil elegante -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.4"/>

  <!-- Emblema Central: POS / Shopping / Facturación -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Base de caja registradora / terminal comercial -->
    <rect x="44" y="84" width="296" height="236" rx="28" fill="url(#accentGrad)"/>
    
    <!-- Pantalla del terminal -->
    <rect x="74" y="114" width="236" height="116" rx="16" fill="#0f172a"/>
    
    <!-- Líneas de datos en pantalla -->
    <line x1="98" y1="144" x2="188" y2="144" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <line x1="98" y1="174" x2="248" y2="174" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="280" cy="144" r="8" fill="#10b981"/>

    <!-- Teclado numérico / botones del POS -->
    <circle cx="108" cy="260" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="152" cy="260" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="196" cy="260" r="14" fill="#ffffff" opacity="0.9"/>
    <rect x="236" y="246" width="64" height="28" rx="8" fill="#ffffff" opacity="0.95"/>
    
    <!-- Ranura / Ticket saliendo -->
    <path d="M 124 84 L 124 36 L 260 36 L 260 84 Z" fill="#f8fafc"/>
    <line x1="148" y1="52" x2="236" y2="52" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <line x1="148" y1="66" x2="216" y2="66" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Letras institucionales SRI / POS -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="4" text-anchor="middle">POS ECUADOR</text>
</svg>
